<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Funko Pop Showcase — Jeremy, Ray & Glenn</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow-x: hidden; background: #0a0a0f; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  
  #scene-container {
    width: 100%;
    height: 70vh;
    min-height: 400px;
    position: relative;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
  }
  
  #scene-container canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  
  .label2d {
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.7);
    pointer-events: none;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }
  
  #header {
    text-align: center;
    padding: 20px 15px 10px;
  }
  #header h1 {
    font-size: clamp(1.3rem, 4vw, 2rem);
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #header p {
    color: #888;
    font-size: clamp(0.75rem, 2.5vw, 0.95rem);
    margin-top: 6px;
  }
  
  #gallery {
    padding: 20px 15px 40px;
    max-width: 900px;
    margin: 0 auto;
  }
  #gallery h2 {
    text-align: center;
    font-size: clamp(1rem, 3vw, 1.4rem);
    margin-bottom: 18px;
    color: #ccc;
  }
  .gallery-row {
    margin-bottom: 20px;
  }
  .gallery-row h3 {
    font-size: clamp(0.85rem, 2.5vw, 1.05rem);
    margin-bottom: 10px;
    padding-left: 5px;
    border-left: 3px solid;
  }
  .gallery-jeremy h3 { border-color: #3b82f6; color: #93c5fd; }
  .gallery-ray h3 { border-color: #a78bfa; color: #c4b5fd; }
  .gallery-glenn h3 { border-color: #34d399; color: #6ee7b7; }
  
  .gallery-thumbs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .gallery-thumbs img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid #333;
    flex-shrink: 0;
    transition: border-color 0.2s, transform 0.2s;
  }
  .gallery-thumbs img:hover {
    border-color: #666;
    transform: scale(1.05);
  }
  .gallery-thumbs .thumb-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .gallery-thumbs .thumb-label {
    position: absolute;
    bottom: 4px;
    left: 4px;
    right: 4px;
    text-align: center;
    font-size: 0.65rem;
    font-weight: 600;
    color: #fff;
    background: rgba(0,0,0,0.6);
    border-radius: 4px;
    padding: 2px;
  }
  
  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #888;
    font-size: 1.1rem;
  }
  
  #hint {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: #555;
    font-size: 0.75rem;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="header">
  <h1>🎨 Funko Pop Showcase</h1>
  <p>Jeremy · Ray · Glenn — Drag to rotate, pinch to zoom</p>
</div>

<div id="scene-container">
  <div id="loading">Loading 3D scene…</div>
  <div id="hint">👆 Drag · Pinch · Scroll</div>
</div>

<div id="gallery">
  <h2>📸 Evolution Gallery</h2>
  
  <div class="gallery-row gallery-jeremy">
    <h3>Jeremy</h3>
    <div class="gallery-thumbs" id="gallery-jeremy"></div>
  </div>
  
  <div class="gallery-row gallery-ray">
    <h3>Ray</h3>
    <div class="gallery-thumbs" id="gallery-ray"></div>
  </div>
  
  <div class="gallery-row gallery-glenn">
    <h3>Glenn</h3>
    <div class="gallery-thumbs" id="gallery-glenn"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ===== SCENE SETUP =====
const container = document.getElementById('scene-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 12, 30);

const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 3, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

// CSS2D renderer for labels
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(container.clientWidth, container.clientHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.8, 0);
controls.update();

// ===== LIGHTING =====
const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(5, 10, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xb0c4ff, 0.4);
fillLight.position.set(-5, 6, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffd700, 0.3);
rimLight.position.set(0, 5, -8);
scene.add(rimLight);

// Ground (subtle reflective floor)
const groundGeo = new THREE.CircleGeometry(15, 64);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x111118,
  roughness: 0.6,
  metalness: 0.2
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ===== TEXTURE LOADING =====
const textureLoader = new THREE.TextureLoader();

function loadFaceTexture(url) {
  return new Promise((resolve, reject) => {
    textureLoader.load(url, (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      resolve(texture);
    }, undefined, reject);
  });
}

// ===== FUNKO POP BUILDER =====
function createFunkoPop(config) {
  const group = new THREE.Group();
  
  // --- HEAD (large sphere, slightly squished) ---
  const headGeo = new THREE.SphereGeometry(1.0, 48, 48);
  const headMat = new THREE.MeshStandardMaterial({
    color: 0xf5e6d3, // skin tone base
    roughness: 0.5,
    metalness: 0.05
  });
  const head = new THREE.Mesh(headGeo, headMat);
  head.scale.set(1.05, 0.98, 1.05);
  head.position.y = 3.2;
  head.castShadow = true;
  head.receiveShadow = true;
  group.add(head);
  
  // --- FACE TEXTURE on front of head ---
  // Use a slightly curved plane positioned just in front of the head sphere
  if (config.faceTexture) {
    const faceGeo = new THREE.PlaneGeometry(1.3, 1.3, 16, 16);
    // Curve the plane to match sphere curvature
    const posAttr = faceGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const y = posAttr.getY(i);
      const dist = Math.sqrt(x * x + y * y);
      const maxDist = Math.sqrt(0.65 * 0.65 + 0.65 * 0.65);
      if (dist < 0.85) {
        const z = Math.sqrt(Math.max(0, 1.05 * 1.05 - x * x - y * y)) - 1.02;
        posAttr.setZ(i, Math.max(z, -0.1));
      }
    }
    faceGeo.computeVertexNormals();
    
    const faceMat = new THREE.MeshStandardMaterial({
      map: config.faceTexture,
      transparent: true,
      roughness: 0.4,
      metalness: 0.0,
      side: THREE.FrontSide
    });
    const face = new THREE.Mesh(faceGeo, faceMat);
    face.position.set(0, 3.2, 1.0);
    face.castShadow = true;
    group.add(face);
  }
  
  // --- HAIR (simple dark cap on top-back of head) ---
  const hairGeo = new THREE.SphereGeometry(1.02, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.55);
  const hairMat = new THREE.MeshStandardMaterial({
    color: config.hairColor || 0x3a2010,
    roughness: 0.7,
    metalness: 0.0
  });
  const hair = new THREE.Mesh(hairGeo, hairMat);
  hair.position.y = 3.2;
  hair.castShadow = true;
  group.add(hair);
  
  // --- BODY (tapered cylinder) ---
  const bodyGeo = new THREE.CylinderGeometry(0.55, 0.75, 1.5, 32);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: config.shirtColor,
    roughness: 0.35,
    metalness: 0.1
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.65;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);
  
  // --- NECK (small cylinder connecting head to body) ---
  const neckGeo = new THREE.CylinderGeometry(0.22, 0.25, 0.35, 16);
  const neckMat = new THREE.MeshStandardMaterial({
    color: 0xf5e6d3,
    roughness: 0.5,
    metalness: 0.05
  });
  const neck = new THREE.Mesh(neckGeo, neckMat);
  neck.position.y = 2.5;
  neck.castShadow = true;
  group.add(neck);
  
  // --- ARMS (small cylinders on sides) ---
  const armGeo = new THREE.CapsuleGeometry(0.12, 0.5, 8, 16);
  const armMat = new THREE.MeshStandardMaterial({
    color: config.shirtColor,
    roughness: 0.35,
    metalness: 0.1
  });
  
  const leftArm = new THREE.Mesh(armGeo, armMat);
  leftArm.position.set(-0.68, 1.75, 0);
  leftArm.rotation.z = 0.15;
  leftArm.castShadow = true;
  group.add(leftArm);
  
  const rightArm = new THREE.Mesh(armGeo, armMat);
  rightArm.position.set(0.68, 1.75, 0);
  rightArm.rotation.z = -0.15;
  rightArm.castShadow = true;
  group.add(rightArm);
  
  // --- HANDS (small spheres at end of arms) ---
  const handGeo = new THREE.SphereGeometry(0.14, 16, 16);
  const handMat = new THREE.MeshStandardMaterial({
    color: 0xf5e6d3,
    roughness: 0.5
  });
  
  const leftHand = new THREE.Mesh(handGeo, handMat);
  leftHand.position.set(-0.75, 1.42, 0);
  leftHand.castShadow = true;
  group.add(leftHand);
  
  const rightHand = new THREE.Mesh(handGeo, handMat);
  rightHand.position.set(0.75, 1.42, 0);
  rightHand.castShadow = true;
  group.add(rightHand);
  
  // --- BASE (pedestal disc) ---
  const baseGeo = new THREE.CylinderGeometry(0.9, 0.95, 0.2, 48);
  const baseMat = new THREE.MeshStandardMaterial({
    color: config.baseColor,
    roughness: 0.3,
    metalness: 0.3
  });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.1;
  base.castShadow = true;
  base.receiveShadow = true;
  group.add(base);
  
  // --- BASE TOP (slightly lighter disc for name area) ---
  const baseTopGeo = new THREE.CylinderGeometry(0.88, 0.88, 0.02, 48);
  const baseTopMat = new THREE.MeshStandardMaterial({
    color: config.baseColor,
    roughness: 0.2,
    metalness: 0.4,
    emissive: config.baseColor,
    emissiveIntensity: 0.15
  });
  const baseTop = new THREE.Mesh(baseTopGeo, baseTopMat);
  baseTop.position.y = 0.21;
  group.add(baseTop);
  
  // --- NAME LABEL (CSS2D) ---
  const labelDiv = document.createElement('div');
  labelDiv.className = 'label2d';
  labelDiv.textContent = config.name;
  labelDiv.style.background = `rgba(${config.labelRgb}, 0.5)`;
  labelDiv.style.border = `1px solid rgba(${config.labelRgb}, 0.6)`;
  const label = new CSS2DObject(labelDiv);
  label.position.set(0, 4.5, 0);
  group.add(label);
  
  // Position the whole figure
  group.position.x = config.x;
  
  return group;
}

// ===== BUILD FIGURES =====
async function init() {
  let jeremyFace, rayFace, glennFace;
  
  try {
    [jeremyFace, rayFace, glennFace] = await Promise.all([
      loadFaceTexture('images/v5/jeremy.png'),
      loadFaceTexture('images/v5/ray.png'),
      loadFaceTexture('images/v5/glenn.png')
    ]);
  } catch (e) {
    console.warn('V5 textures failed, trying textures/ folder', e);
    try {
      [jeremyFace, rayFace, glennFace] = await Promise.all([
        loadFaceTexture('textures/jeremy.png'),
        loadFaceTexture('textures/ray.png'),
        loadFaceTexture('textures/glenn.png')
      ]);
    } catch (e2) {
      console.warn('All face textures failed', e2);
    }
  }
  
  // Jeremy — blue theme
  const jeremy = createFunkoPop({
    name: 'Jeremy',
    x: -2.6,
    faceTexture: jeremyFace,
    baseColor: 0x2563eb,
    shirtColor: 0x3b82f6,
    hairColor: 0x2a1810,
    labelRgb: '59, 130, 246'
  });
  scene.add(jeremy);
  
  // Ray — purple theme
  const ray = createFunkoPop({
    name: 'Ray',
    x: 0,
    faceTexture: rayFace,
    baseColor: 0x7c3aed,
    shirtColor: 0xa78bfa,
    hairColor: 0x1a1a1a,
    labelRgb: '167, 139, 250'
  });
  scene.add(ray);
  
  // Glenn — green theme
  const glenn = createFunkoPop({
    name: 'Glenn',
    x: 2.6,
    faceTexture: glennFace,
    baseColor: 0x059669,
    shirtColor: 0x34d399,
    hairColor: 0x3a2010,
    labelRgb: '52, 211, 153'
  });
  scene.add(glenn);
  
  // Remove loading text
  const loadingEl = document.getElementById('loading');
  if (loadingEl) loadingEl.remove();
  
  // Start render loop
  animate();
}

// ===== GALLERY =====
function buildGallery() {
  const people = ['jeremy', 'ray', 'glenn'];
  people.forEach(person => {
    const container = document.getElementById(`gallery-${person}`);
    if (!container) return;
    
    const versions = [
      { ver: 'V1', path: `images/v1/${person}.png` },
      { ver: 'V2', path: `images/v2/${person}.png` },
      { ver: 'V3', path: `images/v3/${person}.png` },
      { ver: 'V5', path: `images/v5/${person}.png` },
      { ver: 'Photo', path: `images/reference/${person}.png` },
    ];
    
    versions.forEach(v => {
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';
      
      const img = document.createElement('img');
      img.src = v.path;
      img.alt = `${person} ${v.ver}`;
      img.loading = 'lazy';
      img.onerror = () => { wrap.style.display = 'none'; };
      
      const label = document.createElement('div');
      label.className = 'thumb-label';
      label.textContent = v.ver;
      
      wrap.appendChild(img);
      wrap.appendChild(label);
      container.appendChild(wrap);
    });
  });
}

buildGallery();

// ===== ANIMATION LOOP =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// ===== RESIZE =====
function onResize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}
window.addEventListener('resize, onResize');

// Handle container resize (mobile orientation change, etc.)
if (window.ResizeObserver) {
  const ro = new ResizeObserver(() => onResize());
  ro.observe(container);
}

// ===== START =====
init();
</script>

</body>
</html>
