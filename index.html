<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JC Dream — Funko Pop Collection</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#0a0a12; font-family:'Helvetica Neue',Arial,sans-serif; }
#scene { position:fixed; top:0; left:0; width:100%; height:100%; display:block; }
#ui-overlay {
  position:fixed; top:0; left:0; width:100%; pointer-events:none; z-index:10;
  padding:20px; text-align:center;
}
#title {
  font-size:clamp(20px,4vw,36px); font-weight:700; letter-spacing:2px;
  color:#e8d5b5; text-shadow:0 0 20px rgba(232,213,181,0.4);
  text-transform:uppercase;
}
#subtitle {
  font-size:clamp(11px,2vw,14px); color:#8a8a9a; letter-spacing:3px;
  margin-top:4px; text-transform:uppercase;
}
#controls {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  display:flex; gap:10px; z-index:10; pointer-events:auto;
}
.btn {
  background:rgba(20,20,35,0.85); border:1px solid rgba(232,213,181,0.3);
  color:#e8d5b5; padding:8px 18px; border-radius:20px; cursor:pointer;
  font-size:12px; letter-spacing:1px; text-transform:uppercase;
  transition:all 0.3s; backdrop-filter:blur(8px);
}
.btn:hover { background:rgba(40,40,65,0.9); border-color:rgba(232,213,181,0.6); }
.btn.active { background:rgba(232,213,181,0.15); border-color:rgba(232,213,181,0.7); }
#name-labels {
  position:fixed; bottom:70px; left:0; width:100%; display:flex;
  justify-content:center; gap:40px; z-index:5; pointer-events:none;
}
.name-label {
  font-size:13px; font-weight:700; letter-spacing:4px; color:#e8d5b5;
  text-shadow:0 0 12px rgba(0,0,0,0.9); text-transform:uppercase;
  opacity:0.9;
}
#loading {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  color:#e8d5b5; font-size:18px; letter-spacing:2px; z-index:20;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
.fade-out { opacity:0; transition:opacity 0.6s; }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="ui-overlay">
  <div id="title">JC Dream — Funko Pop Collection</div>
  <div id="subtitle">Interactive Display</div>
</div>

<div id="name-labels">
  <div class="name-label" id="label-jeremy">JEREMY</div>
  <div class="name-label" id="label-ray">RAY</div>
  <div class="name-label" id="label-glenn">GLENN</div>
</div>

<div id="controls">
  <button class="btn" id="btn-reset">Reset View</button>
  <button class="btn" id="btn-premium">Premium Mode</button>
  <button class="btn" id="btn-spin">Auto-Rotate</button>
</div>

<div id="loading">Loading Collection…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

// ===== SCENE SETUP =====
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.FogExp2(0x0a0a12, 0.035);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 7);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minPolarAngle = Math.PI * 0.15;
controls.target.set(0, 1.8, 0);

// ===== LIGHTING =====
const ambient = new THREE.AmbientLight(0x404060, 0.35);
scene.add(ambient);

// Rim/hemisphere light
const hemi = new THREE.HemisphereLight(0x2a2a45, 0x0a0a08, 0.2);
scene.add(hemi);

// Figure spotlights (top-down)
const figureData = [
  { name:'jeremy', x:-2.6, label:'JEREMY' },
  { name:'ray',    x: 0,   label:'RAY' },
  { name:'glenn',  x: 2.6, label:'GLENN' }
];

const spotlights = [];
const premiumStates = []; // track per-figure premium

figureData.forEach((fig, i) => {
  const spot = new THREE.SpotLight(0xfff0d8, 2.8, 10, 0.5, 0.6, 1.2);
  spot.position.set(fig.x, 5.5, 1.2);
  spot.target.position.set(fig.x, 1.5, 0);
  spot.castShadow = true;
  spot.shadow.mapSize.set(1024, 1024);
  spot.shadow.bias = -0.0005;
  spot.shadow.camera.near = 1;
  spot.shadow.camera.far = 12;
  scene.add(spot);
  scene.add(spot.target);
  spotlights.push(spot);
  premiumStates.push(false);
});

// Cool fill light from front
const fill = new THREE.DirectionalLight(0x6080ff, 0.15);
fill.position.set(0, 3, 8);
scene.add(fill);

// ===== FLOOR =====
const floorGeo = new THREE.PlaneGeometry(40, 40);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x111120,
  metalness: 0.75,
  roughness: 0.25,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Subtle floor grid glow
const gridGeo = new THREE.PlaneGeometry(40, 40, 1, 1);
const gridMat = new THREE.MeshBasicMaterial({
  color: 0x1a1a2e,
  transparent: true,
  opacity: 0.0,
});
const grid = new THREE.Mesh(gridGeo, gridMat);
grid.rotation.x = -Math.PI / 2;
grid.position.y = 0.001;
scene.add(grid);

// ===== BACKGROUND GRADIENT GLOW =====
const glowGeo = new THREE.PlaneGeometry(30, 14);
const glowCanvas = document.createElement('canvas');
glowCanvas.width = 512; glowCanvas.height = 256;
const gctx = glowCanvas.getContext('2d');
const grad = gctx.createRadialGradient(256, 128, 20, 256, 128, 240);
grad.addColorStop(0, 'rgba(80,60,120,0.35)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
gctx.fillStyle = grad;
gctx.fillRect(0,0,512,256);
const glowTex = new THREE.CanvasTexture(glowCanvas);
const glowMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent:true, depthWrite:false });
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
glowMesh.position.set(0, 4, -6);
scene.add(glowMesh);

// ===== TEXTURE LOADER =====
const texLoader = new THREE.TextureLoader();
texLoader.crossOrigin = 'anonymous';

const figures = []; // store figure group refs

function loadFigure(name, x) {
  return new Promise((resolve, reject) => {
    texLoader.load(
      `textures/${name}.png`,
      (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = true;
        texture.premultiplyAlpha = true;

        // Compute aspect ratio from image
        const img = texture.image;
        const maxH = 3.0;
        const aspect = img.width / img.height;
        const h = maxH;
        const w = h * aspect;

        // === FIGURE GROUP ===
        const group = new THREE.Group();
        group.position.set(x, 0, 0);
        group.userData = { baseY: 0, phase: Math.random() * Math.PI * 2, name };

        // --- BASE (cylinder) ---
        const baseGeo = new THREE.CylinderGeometry(0.68, 0.72, 0.18, 64);
        const baseMat = new THREE.MeshStandardMaterial({
          color: 0x0d0d12,
          metalness: 0.5,
          roughness: 0.35,
        });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0.09;
        base.castShadow = true;
        base.receiveShadow = true;
        group.add(base);

        // Base top ring glow
        const ringGeo = new THREE.TorusGeometry(0.62, 0.025, 16, 64);
        const ringMat = new THREE.MeshStandardMaterial({
          color: 0xe8d5b5,
          emissive: 0xe8d5b5,
          emissiveIntensity: 0.6,
          metalness: 0.8,
          roughness: 0.2,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.y = 0.185;
        ring.rotation.x = Math.PI / 2;
        group.add(ring);

        // --- STAND ROD (clear acrylic behind figure) ---
        const rodGeo = new THREE.CylinderGeometry(0.022, 0.022, 3.6, 12);
        const rodMat = new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.12,
          metalness: 0,
          roughness: 0,
          transmission: 0.92,
          thickness: 0.05,
        });
        const rod = new THREE.Mesh(rodGeo, rodMat);
        rod.position.set(0.0, 1.8, -0.08);
        group.add(rod);

        // Rod base connector
        const rodBaseGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.1, 16);
        const rodBase = new THREE.Mesh(rodBaseGeo, rodMat);
        rodBase.position.set(0, 0.2, -0.08);
        group.add(rodBase);

        // --- FIGURE PLANE (front) ---
        const planeGeo = new THREE.PlaneGeometry(w, h);
        const planeMat = new THREE.MeshStandardMaterial({
          map: texture,
          transparent: true,
          alphaTest: 0.02,
          side: THREE.DoubleSide,
          roughness: 0.85,
          metalness: 0.0,
          depthWrite: false,
        });
        const frontPlane = new THREE.Mesh(planeGeo, planeMat);
        frontPlane.position.set(0, 0.18 + h/2, 0.0);
        frontPlane.castShadow = true;
        frontPlane.userData.isFigure = true;
        group.add(frontPlane);

        // --- FIGURE PLANE (back — reversed) ---
        const backPlane = new THREE.Mesh(planeGeo.clone(), planeMat.clone());
        backPlane.material.map = texture;
        backPlane.position.set(0, 0.18 + h/2, -0.008);
        backPlane.rotation.y = Math.PI;
        group.add(backPlane);

        // --- DARK EDGE LAYER (thin slice between front & back) ---
        // A very thin box to give the figure "body" when viewed at angle
        const edgeGeo = new THREE.BoxGeometry(w * 0.96, h * 0.96, 0.012);
        const edgeMat = new THREE.MeshStandardMaterial({
          color: 0x1a1a22,
          roughness: 0.9,
          metalness: 0.1,
        });
        const edge = new THREE.Mesh(edgeGeo, edgeMat);
        edge.position.set(0, 0.18 + h/2, -0.004);
        group.add(edge);

        // --- NAME LABEL (floating text below base) ---
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 512; labelCanvas.height = 128;
        const lctx = labelCanvas.getContext('2d');
        lctx.fillStyle = 'rgba(0,0,0,0)';
        lctx.fillRect(0, 0, 512, 128);
        lctx.font = 'bold 52px Helvetica Neue, Arial, sans-serif';
        lctx.fillStyle = '#e8d5b5';
        lctx.textAlign = 'center';
        lctx.textBaseline = 'middle';
        lctx.shadowColor = 'rgba(232,213,181,0.5)';
        lctx.shadowBlur = 12;
        lctx.fillText(name.toUpperCase(), 256, 64);
        const labelTex = new THREE.CanvasTexture(labelCanvas);
        labelTex.colorSpace = THREE.SRGBColorSpace;
        const labelMat = new THREE.MeshBasicMaterial({
          map: labelTex,
          transparent: true,
          depthWrite: false,
        });
        const labelGeo = new THREE.PlaneGeometry(1.6, 0.4);
        const labelMesh = new THREE.Mesh(labelGeo, labelMat);
        labelMesh.position.set(0, -0.02, 0.35);
        labelMesh.rotation.x = -Math.PI / 2.2;
        group.add(labelMesh);

        // Store reference
        group.userData.frontPlane = frontPlane;
        group.userData.spotlight = spotlights[figures.length];
        group.userData.index = figures.length;

        figures.push(group);
        scene.add(group);

        resolve(group);
      },
      undefined,
      (err) => reject(err)
    );
  });
}

// ===== PARTICLES =====
const particleCount = 80;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const velocities = [];
for (let i = 0; i < particleCount; i++) {
  positions[i*3]     = (Math.random() - 0.5) * 16;
  positions[i*3 + 1] = Math.random() * 6;
  positions[i*3 + 2] = (Math.random() - 0.5) * 8;
  velocities.push({
    vx: (Math.random() - 0.5) * 0.003,
    vy: Math.random() * 0.005 + 0.001,
    vz: (Math.random() - 0.5) * 0.003,
  });
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const particleCanvas = document.createElement('canvas');
particleCanvas.width = 32; particleCanvas.height = 32;
const pctx = particleCanvas.getContext('2d');
const pgrad = pctx.createRadialGradient(16, 16, 0, 16, 16, 16);
pgrad.addColorStop(0, 'rgba(255,230,180,1)');
pgrad.addColorStop(1, 'rgba(255,230,180,0)');
pctx.fillStyle = pgrad;
pctx.fillRect(0, 0, 32, 32);
const particleTex = new THREE.CanvasTexture(particleCanvas);

const particleMat = new THREE.PointsMaterial({
  size: 0.06,
  map: particleTex,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  opacity: 0.6,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ===== RAYCAST (click to focus) =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let focusedFigure = null;

canvas.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const meshes = figures.map(g => g.userData.frontPlane);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) {
    const idx = meshes.indexOf(hits[0].object);
    focusFigure(idx);
  }
});

function focusFigure(idx) {
  focusedFigure = idx;
  const fig = figures[idx];
  const tx = fig.position.x;
  controls.target.set(tx, 1.8, 0);
  // smooth tween camera
  animateCameraTo(tx * 0.6 + 0.5, 2.5, 4.5, tx, 1.8, 0);
}

function animateCameraTo(x, y, z, tx, ty, tz) {
  const startPos = camera.position.clone();
  const endPos = new THREE.Vector3(x, y, z);
  const startTarget = controls.target.clone();
  const endTarget = new THREE.Vector3(tx, ty, tz);
  let t = 0;
  function step() {
    t += 0.04;
    if (t > 1) t = 1;
    const ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
    camera.position.lerpVectors(startPos, endPos, ease);
    controls.target.lerpVectors(startTarget, endTarget, ease);
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

// ===== BUTTONS =====
let autoRotate = false;
let premiumMode = false;

document.getElementById('btn-reset').addEventListener('click', () => {
  focusedFigure = null;
  animateCameraTo(0, 2.2, 7, 0, 1.8, 0);
  // reset premium per-figure
  premiumStates.forEach((_, i) => setFigurePremium(i, false));
});

document.getElementById('btn-premium').addEventListener('click', (e) => {
  premiumMode = !premiumMode;
  e.target.classList.toggle('active', premiumMode);
  if (premiumMode) {
    scene.background = new THREE.Color(0x050508);
    scene.fog.density = 0.05;
    ambient.intensity = 0.1;
    spotlights.forEach((s, i) => {
      s.intensity = 5.0;
    });
  } else {
    scene.background = new THREE.Color(0x0a0a12);
    scene.fog.density = 0.035;
    ambient.intensity = 0.35;
    spotlights.forEach(s => { s.intensity = 2.8; });
  }
});

document.getElementById('btn-spin').addEventListener('click', (e) => {
  autoRotate = !autoRotate;
  e.target.classList.toggle('active', autoRotate);
  controls.autoRotate = autoRotate;
  controls.autoRotateSpeed = 0.8;
});

function setFigurePremium(idx, on) {
  premiumStates[idx] = on;
  // Dim others, spotlight this one
  spotlights.forEach((s, i) => {
    if (on) {
      s.intensity = i === idx ? 5.5 : 0.4;
    } else {
      s.intensity = 2.8;
    }
  });
}

// ===== LOAD ALL & INIT =====
Promise.all([
  loadFigure('jeremy', -2.6),
  loadFigure('ray', 0),
  loadFigure('glenn', 2.6),
]).then(() => {
  const loading = document.getElementById('loading');
  loading.classList.add('fade-out');
  setTimeout(() => loading.style.display = 'none', 600);
}).catch(err => {
  document.getElementById('loading').textContent = 'Error loading figures: ' + err.message;
  console.error(err);
});

// ===== ANIMATION LOOP =====
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // Gentle bob
  figures.forEach((fig) => {
    fig.position.y = Math.sin(t * 0.8 + fig.userData.phase) * 0.025;
  });

  // Particles drift up
  const posArr = particleGeo.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    posArr[i*3]     += velocities[i].vx;
    posArr[i*3 + 1] += velocities[i].vy;
    posArr[i*3 + 2] += velocities[i].vz;
    if (posArr[i*3 + 1] > 7) {
      posArr[i*3 + 1] = 0;
      posArr[i*3]     = (Math.random() - 0.5) * 16;
      posArr[i*3 + 2] = (Math.random() - 0.5) * 8;
    }
  }
  particleGeo.attributes.position.needsUpdate = true;

  // Glow mesh subtle pulse
  glowMat.opacity = 0.7 + Math.sin(t * 0.5) * 0.15;

  // Ring emissive pulse
  figures.forEach((fig, i) => {
    // rings pulse is handled by materials; subtle
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ===== RESIZE =====
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== MOBILE: update name labels position =====
function updateLabelPositions() {
  // Hide HTML labels since we have 3D labels now, but keep for accessibility
  document.getElementById('name-labels').style.opacity = '0';
}
// Wait for load
setTimeout(updateLabelPositions, 2000);
</script>
</body>
</html>
