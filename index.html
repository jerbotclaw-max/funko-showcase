<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JC Dream — Funko Pop Collection</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#080812;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  #c{position:fixed;top:0;left:0;width:100%;height:100%}

  /* Header */
  #hd{position:fixed;top:0;left:0;width:100%;text-align:center;padding:24px 20px 14px;background:linear-gradient(180deg,rgba(8,8,18,0.92) 0%,rgba(8,8,18,0) 100%);z-index:10;pointer-events:none}
  #hd h1{font-size:clamp(22px,4vw,36px);font-weight:800;background:linear-gradient(135deg,#fff 0%,#a0b0e0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
  #hd p{font-size:clamp(11px,2vw,14px);color:#606080;margin-top:6px;font-weight:500}

  /* Labels */
  .lbl{position:fixed;transform:translate(-50%,50%);font-weight:800;font-size:15px;letter-spacing:2px;color:#fff;background:rgba(16,16,32,0.88);backdrop-filter:blur(12px);padding:6px 22px;border-radius:24px;border:1px solid rgba(80,80,160,0.25);box-shadow:0 4px 24px rgba(0,0,0,0.4);white-space:nowrap;z-index:8;pointer-events:none;transition:opacity .3s}

  /* Controls */
  #ct{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10}
  .b{background:rgba(16,16,32,0.88);backdrop-filter:blur(12px);border:1px solid rgba(80,80,160,0.25);border-radius:14px;padding:10px 22px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;transition:all .2s ease;user-select:none}
  .b:hover{background:rgba(32,32,64,0.92);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.3)}
  .b:active{transform:translateY(0)}
  .b.on{background:linear-gradient(135deg,#3060ff 0%,#1a30a0 100%);border-color:rgba(100,100,255,0.4)}

  /* STL bar */
  #stl{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:10;flex-wrap:wrap;justify-content:center}
  .stl-lbl{font-size:12px;font-weight:600;color:#505070;letter-spacing:.5px}
  .b.sm{padding:7px 16px;font-size:13px;border-radius:10px;background:rgba(24,24,48,0.88)}
  .b.sm:disabled{opacity:.5;cursor:wait}

  /* Hint */
  #ht{position:fixed;top:50%;right:16px;transform:translateY(-50%);font-size:11px;color:#404060;text-align:right;z-index:5;line-height:1.6;pointer-events:none}

  /* Loader */
  #ld{position:fixed;inset:0;background:#080812;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
  #ld .sp{width:56px;height:56px;border:4px solid #1a1a2e;border-top-color:#3060ff;border-radius:50%;animation:spin .8s linear infinite}
  #ld p{margin-top:20px;color:#606080;font-size:14px;font-weight:600}
  #ld .err{color:#ff5050;font-size:12px;max-width:400px;text-align:center;margin-top:8px;word-break:break-word}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:600px){#ht{display:none}.lbl{font-size:12px;padding:4px 14px}#hd{padding:16px 20px 10px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hd"><h1>JC Dream — Funko Pop Collection</h1><p>Interactive 3D Vinyl Showcase</p></div>
<div class="lbl" id="lbl0" style="opacity:0">JEREMY</div>
<div class="lbl" id="lbl1" style="opacity:0">RAY</div>
<div class="lbl" id="lbl2" style="opacity:0">GLENN</div>
<div id="stl">
  <span class="stl-lbl">📥 Download STL:</span>
  <button class="b sm" data-fig="0">Jeremy</button>
  <button class="b sm" data-fig="1">Ray</button>
  <button class="b sm" data-fig="2">Glenn</button>
</div>
<div id="ct">
  <button class="b" id="btnReset">🔄 Reset View</button>
  <button class="b on" id="btnAuto">🔁 Auto-Rotate</button>
</div>
<div id="ht">Drag to rotate<br>Scroll to zoom<br>Click figure to focus<br>Right-drag to pan</div>
<div id="ld"><div class="sp"></div><p>Loading Funko Pop Collection…</p><div class="err" id="ldErr"></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

const FIGS = [
  { name:'Jeremy', tex:'textures/jeremy.png', x:-4.2 },
  { name:'Ray',    tex:'textures/ray.png',    x:0 },
  { name:'Glenn',  tex:'textures/glenn.png',  x:4.2 }
];
const FIG_H = 5.2;

// ===== SCENE =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080812);
scene.fog = new THREE.Fog(0x080812, 16, 42);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
const defaultCam = new THREE.Vector3(0, 3.5, 16);
camera.position.copy(defaultCam);

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ===== ENVIRONMENT =====
function makeEnv() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,128);
  g.addColorStop(0,'#303048'); g.addColorStop(0.35,'#181828');
  g.addColorStop(0.55,'#0a0a14'); g.addColorStop(0.75,'#121220');
  g.addColorStop(1,'#060610');
  x.fillStyle = g; x.fillRect(0,0,256,128);
  x.fillStyle='rgba(140,140,255,0.25)'; x.fillRect(38,0,3,128);
  x.fillStyle='rgba(255,200,140,0.15)'; x.fillRect(200,0,2,128);
  x.fillStyle='rgba(255,255,255,0.1)'; x.fillRect(128,0,1,128);
  return new THREE.CanvasTexture(c);
}
const envTex = makeEnv();
envTex.mapping = THREE.EquirectangularReflectionMapping;
envTex.colorSpace = THREE.SRGBColorSpace;
scene.environment = envTex;

// ===== LIGHTS =====
function dirLight(col,int,x,y,z,shadow){
  const l = new THREE.DirectionalLight(col,int);
  l.position.set(x,y,z);
  if(shadow){
    l.castShadow=true; l.shadow.mapSize.set(2048,2048);
    l.shadow.camera.near=0.5; l.shadow.camera.far=35;
    l.shadow.camera.left=-14; l.shadow.camera.right=14;
    l.shadow.camera.top=10; l.shadow.camera.bottom=-5;
    l.shadow.bias=-0.0003;
  }
  scene.add(l); return l;
}
dirLight(0xffffff, 2.5, 5, 10, 6, true);
dirLight(0x6088ff, 0.7, -8, 5, 3, false);
dirLight(0xffaa60, 1.0, 0, 6, -8, false);
scene.add(new THREE.AmbientLight(0x202030, 0.35));

// Per-figure spotlights
FIGS.forEach(d=>{
  const s = new THREE.SpotLight(0xffffff, 2.0, 14, Math.PI/5, 0.4, 1.2);
  s.position.set(d.x, 9, 2);
  s.target.position.set(d.x, 2.5, 0);
  scene.add(s); scene.add(s.target);
});

// ===== FLOOR =====
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18, 64),
  new THREE.MeshStandardMaterial({color:0x0a0a16, roughness:0.12, metalness:0.6, envMapIntensity:0.7})
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const shadowCatcher = new THREE.Mesh(
  new THREE.PlaneGeometry(34, 34),
  new THREE.ShadowMaterial({opacity:0.35})
);
shadowCatcher.rotation.x = -Math.PI/2;
shadowCatcher.position.y = 0.015;
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);

// ===== IMAGE LOADING & PROCESSING =====
function loadImage(url){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>res(img);
    img.onerror = ()=>rej(new Error('Failed: '+url));
    img.src = url;
  });
}

function removeWhiteBG(canvas, ctx){
  const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
  const d = imgData.data;
  for(let i=0;i<d.length;i+=4){
    const r=d[i], g=d[i+1], b=d[i+2];
    const maxv=Math.max(r,g,b), minv=Math.min(r,g,b);
    const lum=(r+g+b)/3, range=maxv-minv;
    // Pure background white: very high luminance, near-zero color variation
    if(lum>238 && range<14){
      d[i+3]=0;
    } else if(lum>220 && range<22){
      // Feather anti-aliased edges
      d[i+3]=Math.min(d[i+3], Math.max(0,(255-lum)*10));
    }
  }
  ctx.putImageData(imgData,0,0);
}

function processImage(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(img,0,0);
  removeWhiteBG(c, ctx);
  return c;
}

// ===== FIGURE BUILDER =====
const figures = [];

function buildFigure(data, processedCanvas){
  const group = new THREE.Group();
  group.position.x = data.x;

  const aspect = processedCanvas.width / processedCanvas.height;
  const fw = FIG_H * aspect;

  // --- 3D BASE ---
  const baseMat = new THREE.MeshStandardMaterial({
    color:0x08080e, roughness:0.1, metalness:0.25, envMapIntensity:0.9
  });
  const baseBot = new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.3,0.14,48), baseMat);
  baseBot.position.y = 0.07; baseBot.castShadow=true; baseBot.receiveShadow=true;
  group.add(baseBot);

  const baseTop = new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.15,0.06,48), baseMat);
  baseTop.position.y = 0.17; baseTop.castShadow=true;
  group.add(baseTop);

  // Glowing rim
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(1.0, 0.018, 10, 48),
    new THREE.MeshStandardMaterial({color:0x4070ff, emissive:0x2040ff, emissiveIntensity:0.6, roughness:0.1, metalness:0.8})
  );
  rim.rotation.x = Math.PI/2; rim.position.y = 0.2;
  rim.userData.noPrint = true;
  group.add(rim);

  // Ground glow
  const glow = new THREE.Mesh(
    new THREE.CircleGeometry(1.7, 32),
    new THREE.MeshBasicMaterial({color:0x1830a0, transparent:true, opacity:0.12, depthWrite:false})
  );
  glow.rotation.x = -Math.PI/2; glow.position.y = 0.02;
  glow.userData.noPrint = true;
  group.add(glow);

  // --- FIGURE IMAGE PLANE (front) ---
  const texture = new THREE.CanvasTexture(processedCanvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const figGeo = new THREE.PlaneGeometry(fw, FIG_H);
  const figMat = new THREE.MeshStandardMaterial({
    map: texture,
    transparent: true,
    alphaTest: 0.02,
    roughness: 0.45,
    metalness: 0.0,
    side: THREE.FrontSide,
    envMapIntensity: 0.25
  });
  const figure = new THREE.Mesh(figGeo, figMat);
  figure.position.y = 0.2 + FIG_H/2;
  figure.castShadow = true;
  figure.userData.isFigure = true;
  group.add(figure);

  // --- BACKING (dark, for depth and back-side) ---
  const backTex = texture.clone();
  backTex.wrapS = THREE.RepeatWrapping;
  backTex.repeat.x = -1; // Mirror horizontally
  backTex.needsUpdate = true;

  const backMat = new THREE.MeshStandardMaterial({
    map: backTex,
    transparent: true,
    alphaTest: 0.02,
    color: 0x404050, // Darker tint for back
    roughness: 0.5,
    metalness: 0.0,
    side: THREE.FrontSide,
    envMapIntensity: 0.15
  });
  const backing = new THREE.Mesh(new THREE.PlaneGeometry(fw, FIG_H), backMat);
  backing.position.y = 0.2 + FIG_H/2;
  backing.position.z = -0.06;
  backing.rotation.y = Math.PI; // Face backward
  backing.castShadow = true;
  backing.userData.noPrint = true;
  group.add(backing);

  // --- EDGE FILL (thin frame between front and back for physical depth) ---
  const edgeMat = new THREE.MeshStandardMaterial({color:0x060610, roughness:0.3, metalness:0.1});
  // Left edge
  const edgeL = new THREE.Mesh(new THREE.BoxGeometry(0.06, FIG_H*0.95, 0.06), edgeMat);
  edgeL.position.set(-fw/2, 0.2+FIG_H/2, -0.03);
  edgeL.castShadow = true; edgeL.userData.noPrint = true;
  group.add(edgeL);
  // Right edge
  const edgeR = edgeL.clone();
  edgeR.position.x = fw/2;
  group.add(edgeR);

  group.userData = {name:data.name, figure:figure, fw:fw, aspect:aspect};
  return group;
}

// ===== LOAD & BUILD =====
try {
  const imgs = await Promise.all(FIGS.map(d=>loadImage(d.tex)));
  imgs.forEach((img,i)=>{
    const processed = processImage(img);
    const fig = buildFigure(FIGS[i], processed);
    scene.add(fig);
    figures.push(fig);
    const lbl = document.getElementById('lbl'+i);
    if(lbl) lbl.style.opacity = '1';
  });

  // Hide loader
  const ld = document.getElementById('ld');
  ld.style.opacity = '0';
  setTimeout(()=>{ld.style.display='none';}, 500);
} catch(err){
  document.getElementById('ldErr').textContent = err.message;
  console.error(err);
}

// ===== LABELS =====
const labelEls = [document.getElementById('lbl0'),document.getElementById('lbl1'),document.getElementById('lbl2')];
const lv = new THREE.Vector3();
function updateLabels(){
  for(let i=0;i<FIGS.length;i++){
    lv.set(FIGS[i].x, -0.15, 0).project(camera);
    const sx = (lv.x*0.5+0.5)*innerWidth;
    const sy = (-lv.y*0.5+0.5)*innerHeight;
    labelEls[i].style.left = sx+'px';
    labelEls[i].style.top = sy+'px';
    labelEls[i].style.opacity = lv.z < 1 ? '1' : '0';
  }
}

// ===== CONTROLS =====
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 2.5, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// Click to focus
const raycaster = new THREE.Raycaster();
const mv = new THREE.Vector2();
let downPos = null;

renderer.domElement.addEventListener('pointerdown', e=>{
  if(e.button!==0) return;
  downPos = {x:e.clientX, y:e.clientY};
});
renderer.domElement.addEventListener('pointerup', e=>{
  if(e.button!==0 || !downPos) return;
  const dx=e.clientX-downPos.x, dy=e.clientY-downPos.y;
  if(Math.hypot(dx,dy)>6){downPos=null; return;}
  mv.x = (e.clientX/innerWidth)*2-1;
  mv.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mv, camera);
  const hits = raycaster.intersectObjects(figures, true);
  if(hits.length>0){
    let o = hits[0].object;
    while(o.parent && figures.indexOf(o)===-1) o = o.parent;
    if(figures.indexOf(o)!==-1){
      camTween(o.position.x, 3, 7, o.position.x, 2.5, 0);
      controls.autoRotate = false;
      document.getElementById('btnAuto').classList.remove('on');
    }
  }
  downPos = null;
});

function camTween(px,py,pz,tx,ty,tz){
  const sp = camera.position.clone(), st = controls.target.clone();
  const tp = new THREE.Vector3(px,py,pz), tt = new THREE.Vector3(tx,ty,tz);
  const t0 = performance.now();
  (function step(){
    const t = Math.min(1,(performance.now()-t0)/800);
    const e = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    camera.position.lerpVectors(sp,tp,e);
    controls.target.lerpVectors(st,tt,e);
    if(t<1) requestAnimationFrame(step);
  })();
}

document.getElementById('btnReset').addEventListener('click',()=>{
  camTween(defaultCam.x, defaultCam.y, defaultCam.z, 0, 2.5, 0);
});

const btnA = document.getElementById('btnAuto');
btnA.addEventListener('click',()=>{
  controls.autoRotate = !controls.autoRotate;
  btnA.classList.toggle('on', controls.autoRotate);
});

// ===== STL EXPORT =====
function exportSTL(idx){
  const name = FIGS[idx].name;
  const btn = document.querySelectorAll('[data-fig]')[idx];
  if(btn){btn.textContent='⏳';btn.disabled=true;}

  setTimeout(()=>{
    try {
      // Build a simple 3D-printable blank Funko approximation
      const g = new THREE.Group();
      const base = new THREE.CylinderGeometry(1.15,1.3,0.14,48); base.translate(0,0.07,0);
      g.add(new THREE.Mesh(base));
      const base2 = new THREE.CylinderGeometry(1.0,1.15,0.06,48); base2.translate(0,0.17,0);
      g.add(new THREE.Mesh(base2));
      const neck = new THREE.CylinderGeometry(0.36,0.42,0.5,16); neck.translate(0,2.3,0);
      g.add(new THREE.Mesh(neck));
      const body = new THREE.CapsuleGeometry(0.7,1.2,8,20); body.translate(0,1.7,0);
      g.add(new THREE.Mesh(body));
      const head = new THREE.SphereGeometry(1.0,32,28); head.scale(0.92,1.0,0.92); head.translate(0,3.4,0);
      g.add(new THREE.Mesh(head));

      const exporter = new STLExporter();
      const result = exporter.parse(g, {binary:true});
      let blob;
      if(result && result.buffer instanceof ArrayBuffer) blob = new Blob([result.buffer],{type:'model/stl'});
      else if(result instanceof ArrayBuffer) blob = new Blob([result],{type:'model/stl'});
      else blob = new Blob([result],{type:'model/stl'});

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name+'-funko.stl';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch(e){
      console.error('STL error:',e);
      alert('STL export failed: '+e.message);
    } finally {
      if(btn){btn.textContent=name;btn.disabled=false;}
    }
  },60);
}
document.querySelectorAll('[data-fig]').forEach(b=>{
  b.addEventListener('click',()=>exportSTL(parseInt(b.dataset.fig,10)));
});

// ===== RESIZE =====
addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ===== RENDER LOOP =====
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // Billboard: rotate figures to face camera (Y-axis only, keep upright)
  // 3D bases are radially symmetric so they look fine rotating
  figures.forEach((f,i)=>{
    const dx = camera.position.x - f.position.x;
    const dz = camera.position.z - f.position.z;
    f.rotation.y = Math.atan2(dx, dz);
    // Subtle floating bob on the figure plane
    if(f.userData.figure)
      f.userData.figure.position.y = 0.2 + FIG_H/2 + Math.sin(t*0.8 + i*1.7)*0.025;
  });
  controls.update();
  updateLabels();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
