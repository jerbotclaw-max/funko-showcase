<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JC Dream — Funko Pop Collection</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#0a0a12; font-family:'Helvetica Neue',Arial,sans-serif; }
#scene { position:fixed; top:0; left:0; width:100%; height:100%; display:block; }
#ui-overlay {
  position:fixed; top:0; left:0; width:100%; pointer-events:none; z-index:10;
  padding:16px 20px; text-align:center;
}
#title {
  font-size:clamp(20px,4vw,36px); font-weight:700; letter-spacing:2px;
  color:#e8d5b5; text-shadow:0 0 20px rgba(232,213,181,0.4);
  text-transform:uppercase;
}
#subtitle {
  font-size:clamp(11px,2vw,14px); color:#8a8a9a; letter-spacing:3px;
  margin-top:4px; text-transform:uppercase;
}
#version-bar {
  position:fixed; top:64px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:15; pointer-events:auto;
  flex-wrap:wrap; justify-content:center;
}
.vbtn {
  background:rgba(20,20,35,0.85); border:1px solid rgba(232,213,181,0.25);
  color:#8a8a9a; padding:6px 14px; border-radius:16px; cursor:pointer;
  font-size:11px; letter-spacing:1px; text-transform:uppercase;
  transition:all 0.3s; backdrop-filter:blur(8px); white-space:nowrap;
}
.vbtn:hover { background:rgba(40,40,65,0.9); color:#e8d5b5; border-color:rgba(232,213,181,0.5); }
.vbtn.active { background:rgba(232,213,181,0.15); border-color:rgba(232,213,181,0.7); color:#e8d5b5; }
#controls {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  display:flex; gap:10px; z-index:10; pointer-events:auto;
}
.btn {
  background:rgba(20,20,35,0.85); border:1px solid rgba(232,213,181,0.3);
  color:#e8d5b5; padding:8px 18px; border-radius:20px; cursor:pointer;
  font-size:12px; letter-spacing:1px; text-transform:uppercase;
  transition:all 0.3s; backdrop-filter:blur(8px);
}
.btn:hover { background:rgba(40,40,65,0.9); border-color:rgba(232,213,181,0.6); }
.btn.active { background:rgba(232,213,181,0.15); border-color:rgba(232,213,181,0.7); }
#loading {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  color:#e8d5b5; font-size:18px; letter-spacing:2px; z-index:20;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
.fade-out { opacity:0; transition:opacity 0.6s; }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="ui-overlay">
  <div id="title">JC Dream — Funko Pop Collection</div>
  <div id="subtitle">V4: Standee</div>
</div>

<div id="version-bar">
  <button class="vbtn" data-version="1">V1 Procedural</button>
  <button class="vbtn" data-version="2">V2 Labeled</button>
  <button class="vbtn" data-version="3">V3 Face Textures</button>
  <button class="vbtn active" data-version="4">V4 Standee</button>
</div>

<div id="controls">
  <button class="btn" id="btn-reset">Reset View</button>
  <button class="btn" id="btn-spin">Auto-Rotate</button>
</div>

<div id="loading">Loading Collection…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== RENDERER / SCENE / CAMERA =====
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.FogExp2(0x0a0a12, 0.035);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 7);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minPolarAngle = Math.PI * 0.15;
controls.target.set(0, 1.8, 0);

// ===== LIGHTING =====
const ambient = new THREE.AmbientLight(0x404060, 0.35);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x2a2a45, 0x0a0a08, 0.2);
scene.add(hemi);

const figureData = [
  { name:'jeremy', x:-2.6, label:'JEREMY', coat:0x1a2238, accent:0x2a3a5a },
  { name:'ray',    x: 0,   label:'RAY',    coat:0x1a1a1a, accent:0x333333 },
  { name:'glenn',  x: 2.6, label:'GLENN',  coat:0x0a0a0a, accent:0x1a1a1a },
];

const spotlights = [];
figureData.forEach((fig) => {
  const spot = new THREE.SpotLight(0xfff0d8, 2.8, 10, 0.5, 0.6, 1.2);
  spot.position.set(fig.x, 5.5, 1.2);
  spot.target.position.set(fig.x, 1.5, 0);
  spot.castShadow = true;
  spot.shadow.mapSize.set(1024, 1024);
  spot.shadow.bias = -0.0005;
  spot.shadow.camera.near = 1;
  spot.shadow.camera.far = 12;
  scene.add(spot);
  scene.add(spot.target);
  spotlights.push(spot);
});

const fill = new THREE.DirectionalLight(0x6080ff, 0.15);
fill.position.set(0, 3, 8);
scene.add(fill);

// ===== FLOOR =====
const floorMat = new THREE.MeshStandardMaterial({ color:0x111120, metalness:0.75, roughness:0.25 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,40), floorMat);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
scene.add(floor);

// ===== BACKGROUND GLOW =====
const glowCanvas = document.createElement('canvas');
glowCanvas.width=512; glowCanvas.height=256;
const gctx = glowCanvas.getContext('2d');
const grad = gctx.createRadialGradient(256,128,20,256,128,240);
grad.addColorStop(0,'rgba(80,60,120,0.35)'); grad.addColorStop(1,'rgba(0,0,0,0)');
gctx.fillStyle=grad; gctx.fillRect(0,0,512,256);
const glowTex = new THREE.CanvasTexture(glowCanvas);
const glowMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(30,14),
  new THREE.MeshBasicMaterial({ map:glowTex, transparent:true, depthWrite:false })
);
glowMesh.position.set(0,4,-6); scene.add(glowMesh);

// ===== PARTICLES =====
const particleCount=80, particleGeo=new THREE.BufferGeometry();
const positions=new Float32Array(particleCount*3), velocities=[];
for(let i=0;i<particleCount;i++){
  positions[i*3]=(Math.random()-0.5)*16; positions[i*3+1]=Math.random()*6; positions[i*3+2]=(Math.random()-0.5)*8;
  velocities.push({vx:(Math.random()-0.5)*0.003,vy:Math.random()*0.005+0.001,vz:(Math.random()-0.5)*0.003});
}
particleGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
const pCanvas=document.createElement('canvas'); pCanvas.width=32; pCanvas.height=32;
const pctx=pCanvas.getContext('2d');
const pg=pctx.createRadialGradient(16,16,0,16,16,16);
pg.addColorStop(0,'rgba(255,230,180,1)'); pg.addColorStop(1,'rgba(255,230,180,0)');
pctx.fillStyle=pg; pctx.fillRect(0,0,32,32);
const particles=new THREE.Points(particleGeo,new THREE.PointsMaterial({
  size:0.06,map:new THREE.CanvasTexture(pCanvas),transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false,opacity:0.6
}));
scene.add(particles);

// ===== TEXTURE LOADER =====
const texLoader = new THREE.TextureLoader();
texLoader.crossOrigin = 'anonymous';

// ===== STATE =====
let currentVersion = 4;
let figureGroups = []; // active groups in scene
let autoRotate = false;

// ===== NAME LABEL TEXTURE HELPER =====
function makeLabelTexture(name) {
  const c = document.createElement('canvas');
  c.width=512; c.height=128;
  const ctx=c.getContext('2d');
  ctx.font='bold 52px Helvetica Neue, Arial, sans-serif';
  ctx.fillStyle='#e8d5b5'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(232,213,181,0.5)'; ctx.shadowBlur=12;
  ctx.fillText(name.toUpperCase(),256,64);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}

// ===== BASE (shared) =====
function makeBase() {
  const g = new THREE.Group();
  const baseGeo = new THREE.CylinderGeometry(0.68,0.72,0.18,64);
  const baseMat = new THREE.MeshStandardMaterial({ color:0x0d0d12, metalness:0.5, roughness:0.35 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y=0.09; base.castShadow=true; base.receiveShadow=true;
  g.add(base);
  const ringGeo = new THREE.TorusGeometry(0.62,0.025,16,64);
  const ringMat = new THREE.MeshStandardMaterial({ color:0xe8d5b5, emissive:0xe8d5b5, emissiveIntensity:0.6, metalness:0.8, roughness:0.2 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.y=0.185; ring.rotation.x=Math.PI/2;
  g.add(ring);
  return g;
}

function makeLabel3D(name) {
  const tex = makeLabelTexture(name);
  const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6,0.4), mat);
  mesh.position.set(0,-0.02,0.35); mesh.rotation.x=-Math.PI/2.2;
  return mesh;
}

// ===== CLEAR FIGURES =====
function clearFigures() {
  figureGroups.forEach(g => {
    scene.remove(g);
    g.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m=>m.dispose());
        else obj.material.dispose();
      }
    });
  });
  figureGroups = [];
}

// ===== V1: PROCEDURAL (no labels) =====
function buildV1() {
  clearFigures();
  figureData.forEach((fig) => {
    const group = makeBase();
    group.position.set(fig.x, 0, 0);
    group.userData = { baseY:0, phase:Math.random()*Math.PI*2, name:fig.name };

    // Body — cylinder (vinyl body)
    const bodyGeo = new THREE.CylinderGeometry(0.42, 0.48, 1.3, 24);
    const bodyMat = new THREE.MeshStandardMaterial({ color:fig.coat, roughness:0.6, metalness:0.1 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.18 + 0.65;
    body.castShadow = true;
    group.add(body);

    // Head — sphere
    const headGeo = new THREE.SphereGeometry(0.38, 32, 32);
    const headMat = new THREE.MeshStandardMaterial({ color:0xc4a884, roughness:0.5 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 0.18 + 1.3 + 0.38;
    head.castShadow = true;
    group.add(head);

    // Beard — dark blob on lower face
    const beardGeo = new THREE.SphereGeometry(0.26, 16, 16);
    const beardMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.9 });
    const beard = new THREE.Mesh(beardGeo, beardMat);
    beard.position.set(0, 0.18+1.3+0.24, 0.18);
    beard.scale.set(1, 0.8, 0.6);
    group.add(beard);

    group.userData.frontPlane = head;
    figureGroups.push(group);
    scene.add(group);
  });
}

// ===== V2: PROCEDURAL + LABELS =====
function buildV2() {
  clearFigures();
  figureData.forEach((fig) => {
    const group = makeBase();
    group.position.set(fig.x, 0, 0);
    group.userData = { baseY:0, phase:Math.random()*Math.PI*2, name:fig.name };

    // Same procedural body
    const bodyGeo = new THREE.CylinderGeometry(0.42, 0.48, 1.3, 24);
    const bodyMat = new THREE.MeshStandardMaterial({ color:fig.coat, roughness:0.6, metalness:0.1 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.18 + 0.65;
    body.castShadow = true;
    group.add(body);

    const headGeo = new THREE.SphereGeometry(0.38, 32, 32);
    const headMat = new THREE.MeshStandardMaterial({ color:0xc4a884, roughness:0.5 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 0.18 + 1.3 + 0.38;
    head.castShadow = true;
    group.add(head);

    const beardGeo = new THREE.SphereGeometry(0.26, 16, 16);
    const beardMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.9 });
    const beard = new THREE.Mesh(beardGeo, beardMat);
    beard.position.set(0, 0.18+1.3+0.24, 0.18);
    beard.scale.set(1, 0.8, 0.6);
    group.add(beard);

    // Name label
    group.add(makeLabel3D(fig.name));

    group.userData.frontPlane = head;
    figureGroups.push(group);
    scene.add(group);
  });
}

// ===== V3: FACE TEXTURES =====
function buildV3() {
  clearFigures();
  let loaded = 0;
  const total = figureData.length;

  figureData.forEach((fig) => {
    const group = makeBase();
    group.position.set(fig.x, 0, 0);
    group.userData = { baseY:0, phase:Math.random()*Math.PI*2, name:fig.name };

    // Procedural body
    const bodyGeo = new THREE.CylinderGeometry(0.42, 0.48, 1.3, 24);
    const bodyMat = new THREE.MeshStandardMaterial({ color:fig.coat, roughness:0.6, metalness:0.1 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.18 + 0.65;
    body.castShadow = true;
    group.add(body);

    // Head sphere (will get texture)
    const headGeo = new THREE.SphereGeometry(0.42, 32, 32);
    const headMat = new THREE.MeshStandardMaterial({ color:0xc4a884, roughness:0.5 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 0.18 + 1.3 + 0.38;
    head.castShadow = true;
    group.add(head);

    // Beard
    const beardGeo = new THREE.SphereGeometry(0.26, 16, 16);
    const beardMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.9 });
    const beard = new THREE.Mesh(beardGeo, beardMat);
    beard.position.set(0, 0.18+1.3+0.24, 0.22);
    beard.scale.set(1, 0.8, 0.6);
    group.add(beard);

    // Name label
    group.add(makeLabel3D(fig.name));

    group.userData.frontPlane = head;

    // Load face texture and map onto a plane on front of head
    texLoader.load(`textures/${fig.name}.png`, (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      // Billboard plane showing face, positioned on front of head
      const faceGeo = new THREE.PlaneGeometry(0.6, 0.6);
      const faceMat = new THREE.MeshStandardMaterial({
        map: texture, transparent:true, alphaTest:0.02,
        side: THREE.DoubleSide, roughness:0.8, metalness:0.0, depthWrite:false
      });
      const facePlane = new THREE.Mesh(faceGeo, faceMat);
      facePlane.position.set(0, 0.18+1.3+0.36, 0.40);
      group.add(facePlane);

      loaded++;
      if (loaded === total) hideLoading();
    }, undefined, () => { loaded++; if(loaded===total) hideLoading(); });

    figureGroups.push(group);
    scene.add(group);
  });
}

// ===== V4: STANDEE =====
function buildV4() {
  clearFigures();
  let loaded = 0;
  const total = figureData.length;

  figureData.forEach((fig) => {
    texLoader.load(`textures/${fig.name}.png`, (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.premultiplyAlpha = true;

      const img = texture.image;
      const maxH = 3.0;
      const aspect = img.width / img.height;
      const h = maxH, w = h * aspect;

      const group = makeBase();
      group.position.set(fig.x, 0, 0);
      group.userData = { baseY:0, phase:Math.random()*Math.PI*2, name:fig.name };

      // Stand rod
      const rodMat = new THREE.MeshPhysicalMaterial({
        color:0xffffff, transparent:true, opacity:0.12, metalness:0, roughness:0,
        transmission:0.92, thickness:0.05
      });
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,3.6,12), rodMat);
      rod.position.set(0,1.8,-0.08); group.add(rod);
      const rodBase = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.1,16), rodMat);
      rodBase.position.set(0,0.2,-0.08); group.add(rodBase);

      // Front plane
      const planeMat = new THREE.MeshStandardMaterial({
        map:texture, transparent:true, alphaTest:0.02,
        side:THREE.DoubleSide, roughness:0.85, metalness:0.0, depthWrite:false
      });
      const frontPlane = new THREE.Mesh(new THREE.PlaneGeometry(w,h), planeMat);
      frontPlane.position.set(0, 0.18+h/2, 0);
      frontPlane.castShadow = true;
      group.add(frontPlane);

      // Back plane
      const backPlane = new THREE.Mesh(new THREE.PlaneGeometry(w,h), planeMat.clone());
      backPlane.material.map = texture;
      backPlane.position.set(0, 0.18+h/2, -0.008);
      backPlane.rotation.y = Math.PI;
      group.add(backPlane);

      // Edge slice
      const edgeMat = new THREE.MeshStandardMaterial({ color:0x1a1a22, roughness:0.9, metalness:0.1 });
      const edge = new THREE.Mesh(new THREE.BoxGeometry(w*0.96,h*0.96,0.012), edgeMat);
      edge.position.set(0, 0.18+h/2, -0.004);
      group.add(edge);

      // Label
      group.add(makeLabel3D(fig.name));

      group.userData.frontPlane = frontPlane;
      figureGroups.push(group);
      scene.add(group);

      loaded++;
      if (loaded === total) hideLoading();
    }, undefined, (err) => {
      console.error('Load error for', fig.name, err);
      loaded++; if (loaded===total) hideLoading();
    });
  });
}

// ===== LOADING =====
function hideLoading() {
  const loading = document.getElementById('loading');
  loading.classList.add('fade-out');
  setTimeout(() => loading.style.display='none', 600);
}

// ===== VERSION SWITCH =====
function switchVersion(v) {
  currentVersion = v;
  document.querySelectorAll('.vbtn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.version) === v);
  });
  const labels = { 1:'V1: Procedural 3D', 2:'V2: Labeled', 3:'V3: Face Textures', 4:'V4: Standee' };
  document.getElementById('subtitle').textContent = labels[v];

  // Show loading for async versions
  if (v >= 3) {
    const loading = document.getElementById('loading');
    loading.style.display=''; loading.classList.remove('fade-out');
    loading.textContent = 'Loading…';
  }

  if (v === 1) { buildV1(); hideLoading(); }
  else if (v === 2) { buildV2(); hideLoading(); }
  else if (v === 3) { buildV3(); }
  else if (v === 4) { buildV4(); }
}

document.querySelectorAll('.vbtn').forEach(b => {
  b.addEventListener('click', () => switchVersion(parseInt(b.dataset.version)));
});

// ===== BUTTONS =====
document.getElementById('btn-reset').addEventListener('click', () => {
  animateCameraTo(0, 2.2, 7, 0, 1.8, 0);
});

document.getElementById('btn-spin').addEventListener('click', (e) => {
  autoRotate = !autoRotate;
  e.target.classList.toggle('active', autoRotate);
  controls.autoRotate = autoRotate;
  controls.autoRotateSpeed = 0.8;
});

// ===== CAMERA ANIMATION =====
function animateCameraTo(x, y, z, tx, ty, tz) {
  const startPos = camera.position.clone();
  const endPos = new THREE.Vector3(x, y, z);
  const startTarget = controls.target.clone();
  const endTarget = new THREE.Vector3(tx, ty, tz);
  let t = 0;
  function step() {
    t += 0.04; if (t>1) t=1;
    const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    camera.position.lerpVectors(startPos, endPos, ease);
    controls.target.lerpVectors(startTarget, endTarget, ease);
    if (t<1) requestAnimationFrame(step);
  }
  step();
}

// ===== ANIMATION LOOP =====
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  figureGroups.forEach((fig) => {
    fig.position.y = Math.sin(t*0.8 + (fig.userData.phase||0)) * 0.025;
  });
  const posArr = particleGeo.attributes.position.array;
  for (let i=0; i<particleCount; i++) {
    posArr[i*3]+=velocities[i].vx; posArr[i*3+1]+=velocities[i].vy; posArr[i*3+2]+=velocities[i].vz;
    if (posArr[i*3+1]>7) { posArr[i*3+1]=0; posArr[i*3]=(Math.random()-0.5)*16; posArr[i*3+2]=(Math.random()-0.5)*8; }
  }
  particleGeo.attributes.position.needsUpdate = true;
  glowMesh.material.opacity = 0.7 + Math.sin(t*0.5)*0.15;
  controls.update();
  renderer.render(scene, camera);
}

// ===== RESIZE =====
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== INIT =====
switchVersion(4);
animate();
</script>
</body>
</html>
