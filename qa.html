<!doctype html><html><head><meta charset="utf-8"><title>V8 visual QA</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script><style>body{margin:0;background:#0d0e12;color:#fff;font:14px system-ui;padding:16px}h1{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cell{background:#1b1d25;border-radius:10px;overflow:hidden;text-align:center}.cell b{display:block;padding:8px}.cell model-viewer{width:100%;height:320px;background:radial-gradient(circle,#444858,#15161c)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><h1>V8 four-angle visual QA</h1><div class="grid" id="grid"></div><script>const people=['jeremy','ray','glenn'],views=[['front','0deg'],['three-quarter','45deg'],['side','90deg'],['back','180deg']];const g=document.getElementById('grid');for(const p of people)for(const [label,orbit] of views)g.insertAdjacentHTML('beforeend',`<div class="cell"><b>${p.toUpperCase()} · ${label}</b><model-viewer src="models/${p}_funko_v8.glb" camera-orbit="${orbit} 77deg 112%" interaction-prompt="none" shadow-intensity="1.1" exposure="1.05"></model-viewer></div>`);</script></body></html>
